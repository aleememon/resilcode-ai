services:
  postgres:
    image: postgres:16
    container_name: resilcode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resilcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resilcode"]
      interval: 5s
      timeout: 5s
      retries: 5

  semgrep:
    image: semgrep/semgrep:latest
    container_name: resilcode-semgrep
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"] # keep it alive; the backend runs semgrep via docker exec
    network_mode: "none" # scans run fully offline, so your code never leaves the machine
    volumes:
      - ./scans:/scans # extracted projects (written by the backend)
      - ./rules:/rules:ro # your custom rules, read-only

volumes:
  pgdata:
