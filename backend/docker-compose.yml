services:
  postgres:
    image: postgres:16
    container_name: resilcode-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resilcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resilcode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: