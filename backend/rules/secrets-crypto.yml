rules:
  - id: hardcoded-secret-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A password, secret, or API key is written directly in the source code.
      Load it from an environment variable or a secrets manager instead.
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: |
              { ..., $NAME: "$VALUE", ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^.*(password|passwd|pwd|secret|apikey|api_key|secretkey|secret_key|privatekey|private_key|accesstoken|access_token|authtoken|auth_token|clientsecret|client_secret)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^\S{8,}$
    metadata:
      category: secrets
      cwe: CWE-798
      owasp: A07:2021
      confidence: MEDIUM

  - id: hardcoded-secret-known-format
    languages: [generic]
    severity: ERROR
    message: >-
      This text matches the format of a real credential (cloud key, access
      token, or private key). Remove it, rotate the credential, and load it
      from the environment.
    pattern-either:
      - pattern-regex: AKIA[0-9A-Z]{16}
      - pattern-regex: ghp_[A-Za-z0-9]{36}
      - pattern-regex: sk_live_[0-9a-zA-Z]{24,}
      - pattern-regex: -----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----
    metadata:
      category: secrets
      cwe: CWE-798
      owasp: A07:2021
      confidence: HIGH

  - id: hardcoded-secret-envfile
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - ".env*"
        - "*.env"
    message: >-
      An .env file with real-looking secret values is part of the project.
      Do not ship it. Commit an .env.example with empty values instead.
    pattern-regex: (?im)^[A-Z0-9_]*(PASSWORD|SECRET|API_?KEY|PRIVATE_?KEY|ACCESS_TOKEN|AUTH_TOKEN)[A-Z0-9_]*[ \t]*=[ \t]*['"]?[^\s'"$#][^\s'"#]{7,}
    metadata:
      category: secrets
      cwe: CWE-798
      owasp: A07:2021
      confidence: MEDIUM

  - id: hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A JWT is signed or verified with a secret written in the code. Anyone
      who can read the code can forge tokens. Use an environment variable.
    patterns:
      - pattern-either:
          - pattern: $JWT.sign($PAYLOAD, "$SECRET", ...)
          - pattern: $JWT.verify($TOKEN, "$SECRET", ...)
      - metavariable-regex:
          metavariable: $JWT
          regex: (?i)^(jwt|jsonwebtoken)$
    metadata:
      category: secrets
      cwe: CWE-798
      owasp: A07:2021
      confidence: HIGH

  - id: weak-hash-algorithm
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security use. Use SHA-256 or stronger, and
      use bcrypt, scrypt, or argon2 for passwords.
    patterns:
      - pattern-either:
          - pattern: $C.createHash("$ALGO", ...)
          - pattern: createHash("$ALGO", ...)
          - pattern: $C.createHmac("$ALGO", ...)
          - pattern: createHmac("$ALGO", ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)^(md4|md5|sha1|sha-1)$
    metadata:
      category: weak-crypto
      cwe: CWE-328
      owasp: A02:2021
      confidence: MEDIUM

  - id: weak-cipher-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This cipher or mode is weak (DES, RC4, Blowfish, or ECB mode). Use
      AES-256-GCM with a random IV.
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv("$ALGO", ...)
          - pattern: createCipheriv("$ALGO", ...)
          - pattern: $C.createDecipheriv("$ALGO", ...)
          - pattern: createDecipheriv("$ALGO", ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)^(des.*|rc4.*|rc2.*|bf.*|.*blowfish.*|.*-ecb)$
    metadata:
      category: weak-crypto
      cwe: CWE-327
      owasp: A02:2021
      confidence: HIGH

  - id: insecure-random-token
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Math.random() is predictable and must not generate tokens, passwords, or
      secrets. Use crypto.randomBytes() or crypto.randomUUID().
    patterns:
      - pattern-either:
          - pattern: $NAME = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^.*(token|password|secret|session|otp|apikey|nonce).*$
    metadata:
      category: weak-crypto
      cwe: CWE-338
      owasp: A02:2021
      confidence: MEDIUM
