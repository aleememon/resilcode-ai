rules:
  - id: sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      User input flows into a SQL query string. Use parameterized queries
      (placeholders plus a values array) instead of building SQL text.
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.queryRawUnsafe($SQL, ...)
              - pattern: $DB.executeRawUnsafe($SQL, ...)
          - focus-metavariable: $SQL
    metadata:
      category: injection
      cwe: CWE-89
      owasp: A03:2021
      confidence: HIGH

  - id: command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      User input flows into a shell command. Use execFile or spawn with an
      argument array and never pass user input through a shell.
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: cp.exec($CMD, ...)
              - pattern: cp.execSync($CMD, ...)
          - focus-metavariable: $CMD
    metadata:
      category: injection
      cwe: CWE-78
      owasp: A03:2021
      confidence: HIGH

  - id: code-injection-eval
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      User input flows into eval() or new Function(), which runs it as code.
      Remove the dynamic evaluation or parse the data safely (e.g. JSON.parse).
    pattern-sources:
      - pattern: req.query
      - pattern: req.body
      - pattern: req.params
      - pattern: req.headers
      - pattern: req.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE)
              - pattern: new Function(..., $CODE)
          - focus-metavariable: $CODE
    metadata:
      category: injection
      cwe: CWE-95
      owasp: A03:2021
      confidence: HIGH
